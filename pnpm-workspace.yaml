packages:
  - packages/*
overrides:
  form-data: 4.0.6
  ws: 8.21.0
  # Transitive dev-only advisories, all reached through build tooling only
  # (eslint>minimatch, vite/vitest, @vitejs/plugin-vue>vue>@vue/compiler-sfc):
  #   brace-expansion  GHSA — DoS via unbounded intermediate arrays
  #   postcss          GHSA-6g55-p6wh-862q follow-up — arbitrary .map read
  #   nanoid           custom generators loop forever when size is 0
  #   undici           GHSA-qrxm-fqhp-jwvm — DoS via TLS 1.2 renegotiation (via jsdom)
  #   source-map-js    reached through postcss in vite
  #   vite             >=8.2.0 <=8.2.3, reached through @vitest/mocker
  #   @vue/server-renderer  via @vitejs/plugin-vue in packages/vue
  # Each is a patch-level bump within the same major, so pinning forward is
  # safe. Raise these to the advisory's `patched_versions` — a floor that
  # merely satisfies an older advisory silently stops holding when the next
  # one lands, which is how `pnpm audit --audit-level high` in CI went red.
  brace-expansion: '>=5.0.11'
  postcss: '>=8.5.23'
  nanoid: '>=3.3.17'
  undici: '>=8.12.2'
  source-map-js: '>=1.2.2'
  vite: '>=8.2.4'
  '@vue/server-renderer': '>=3.5.42'
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
