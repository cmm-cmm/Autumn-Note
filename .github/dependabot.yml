version: 2

updates:
  # Workflow actions. Bumping these by hand is how the repo ended up pinned to
  # a deprecated runner image until someone noticed.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - '*'

  # Root workspace. Everything here is devDependencies — the published package
  # has no runtime dependencies and must keep it that way.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    labels:
      - dependencies
    groups:
      dev-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /packages/react
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
    labels:
      - dependencies
    ignore:
      # Peer range is intentionally wide (>=18); a devDependency bump to React 19
      # would silently narrow what CI actually exercises.
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
    groups:
      dev-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /packages/vue
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
    labels:
      - dependencies
    groups:
      dev-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
